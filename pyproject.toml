[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hibari-tts"
version = "0.2.1"
description = "Tiny English text-to-speech: 7.9 MB per voice (American and British), about 130x realtime on one CPU core, text in, 24 kHz audio out"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [{name = "Maureese Williams"}]
keywords = ["tts", "text-to-speech", "speech synthesis", "onnx", "kokoro"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["numpy>=1.22", "onnxruntime>=1.16"]

[project.urls]
Homepage = "https://github.com/MMWilliams/hibari"
Model = "https://huggingface.co/maureesewilliams/hibari"
Issues = "https://github.com/MMWilliams/hibari/issues"

[project.optional-dependencies]
fast = ["scipy>=1.9"]
dev = ["pytest", "scipy"]

[project.scripts]
hibari = "hibari.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hibari = ["assets/*"]
